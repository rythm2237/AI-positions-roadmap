<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Career Atelier — Application Agent</title>
<style>
:root{--ink:#182d35;--muted:#687a80;--paper:#fff;--bg:#f2f4f2;--line:#dce3e0;--accent:#275d60;--warm:#e9ddbc;--danger:#9a3434}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:8px 13px;background:#fff;color:var(--ink);transition:background .15s,transform .1s}button:hover{background:#edf3ef;border-color:#9ab5ad}button:active{transform:translateY(1px)}button:disabled{opacity:.45;cursor:wait}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.danger{color:var(--danger)}input,textarea,select{width:100%;border:1px solid #cbd7d1;border-radius:8px;background:#fff;color:var(--ink);padding:10px}textarea{min-height:150px;resize:vertical;line-height:1.6}input:focus,textarea:focus,select:focus{outline:2px solid #9dc6bb;outline-offset:1px}label{display:block;font-size:12px;font-weight:650;margin:14px 0 6px}h1{font:600 28px/1.25 Georgia,serif;margin:8px 0 12px}h2{font:600 22px/1.3 Georgia,serif;margin:0 0 14px}h3{font-size:14px;margin:0 0 10px}p{margin:8px 0 14px}.muted,small{color:var(--muted)}.shell{display:grid;grid-template-columns:205px minmax(420px,1fr) 290px;min-height:100vh}.sidebar{background:#19343b;color:#fff;padding:28px 17px;display:flex;flex-direction:column;gap:6px}.brand{font:600 23px Georgia,serif;letter-spacing:-.5px;padding:0 10px 20px}.brand small{display:block;font:10px system-ui;letter-spacing:2px;color:#b4cec6;margin-top:10px}.sidebar button{text-align:left;background:transparent;color:#ceddd8;border-color:transparent;display:flex;gap:12px;align-items:center}.sidebar button.active{color:#fff;background:#305158}.sidebar button .num{font-size:10px;border:1px solid #627b80;border-radius:50%;height:22px;width:22px;text-align:center;line-height:20px}.sidebar .bottom{margin-top:auto;padding-top:35px}.sidebar select{background:#28484e;color:white;border-color:#607878}.main{min-width:0}.topbar{min-height:76px;background:#fff;border-bottom:1px solid var(--line);padding:16px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px}.topbar strong{display:block}.topbar small{font-size:11px}.stage{padding:20px 28px 0}.steps{display:flex;gap:5px;margin-bottom:8px}.steps span{flex:1;height:4px;background:#dae2dc;border-radius:4px}.steps span.done{background:#47766c}.workspace{padding:24px 28px 45px}.eyebrow{text-transform:uppercase;letter-spacing:1.8px;font-size:10px;font-weight:700;color:var(--accent)}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:23px;margin:18px 0;box-shadow:0 3px 15px #233f3605}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row button{flex:0 0 auto}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.note{background:#f0f5f1;border-left:3px solid #668e7d;padding:12px 15px;border-radius:5px;font-size:12px}.warning{background:#fbf3df;border-color:#be9b54}.badge{display:inline-block;font-size:10px;padding:4px 8px;border-radius:30px;background:#edf2ee;color:#49685d}.badge.red{background:#fbeaea;color:#943f3f}.badge.gold{background:#faf0d8;color:#8b651e}.agent{border-left:1px solid var(--line);background:#fbfcfa;padding:25px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.agent h2{font-size:20px}.agent .messages{flex:1;overflow:auto;margin:15px 0;min-height:80px}.message{border:1px solid var(--line);border-radius:10px;padding:13px;margin-bottom:10px;font-size:12px;white-space:pre-wrap}.message.user{background:#eaf1ec}.agent textarea{min-height:92px;max-height:170px}.chips{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}.chips button{font-size:10px;padding:5px 8px}.score{font:600 48px Georgia,serif}.metric{background:#f4f6f3;border-radius:10px;padding:17px}.metric small{display:block}.metric strong{font-size:21px}table{border-collapse:collapse;width:100%;font-size:12px}td,th{text-align:left;vertical-align:top;padding:13px 9px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.6px}.table-wrap{overflow:auto}.evidence{font-size:11px;color:#546e65;white-space:pre-wrap}.change{border:1px solid var(--line);border-radius:10px;padding:18px;margin:14px 0}.change del{display:block;color:#826560;background:#fbf1eb;text-decoration:none;padding:10px}.change ins{display:block;color:#345f51;background:#ecf4ed;text-decoration:none;padding:10px}.change.pending{border-left:3px solid #bd9f5b}.change.accepted{border-left:3px solid #568c73}.change.rejected{opacity:.7}.preview-wrap{overflow:auto;background:#e9ede8;padding:20px;border-radius:10px}.a4{background:white;width:210mm;min-height:297mm;padding:14mm 15mm;margin:auto;box-shadow:0 5px 18px #00000012;font:11px/1.65 Arial,sans-serif;color:#273439;white-space:normal}.a4 h2{font:700 13px Arial,sans-serif;letter-spacing:.5px;color:#275d60;margin:20px 0 8px;border-bottom:1px solid #d8e2dd;padding-bottom:5px}.a4 .document-header{font:700 26px/1.3 Arial,sans-serif;color:#234b55}.a4 .document-text{white-space:pre-wrap;margin:6px 0}.a4.modern h2,.a4.modern .document-header{color:#344778}.a4.minimal h2,.a4.minimal .document-header{color:#222}.a4.tech h2,.a4.tech .document-header{color:#315946}.editor textarea{min-height:120px;font-size:13px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px}.section-head button{padding:4px 8px;font-size:11px}details{margin-top:10px}summary{cursor:pointer;font-weight:600;font-size:12px}#toast{position:fixed;top:16px;bottom:auto;left:50%;transform:translateX(-50%);width:min(650px,calc(100vw - 32px));max-width:650px;padding:13px 20px;border-radius:9px;background:#193c38;color:white;box-shadow:0 6px 20px #0002;z-index:80;display:none}#busybar{position:fixed;top:0;left:0;height:3px;background:#ae945c;width:100%;z-index:30;display:none;animation:pulse 1s infinite alternate}@keyframes pulse{from{opacity:.3}to{opacity:1}}.empty{padding:45px 18px;text-align:center;color:var(--muted)}.hidden{display:none!important}.tiny{font-size:11px}.check{display:flex;align-items:flex-start;gap:8px;font-size:12px;font-weight:400}.check input{width:auto;margin-top:4px}.upload{border:1px dashed #9db7a9;padding:18px;background:#fafcf9;border-radius:10px}.upload input{padding:0;border:0;background:none}.gap ul{padding-left:20px}.two-editor{display:grid;grid-template-columns:minmax(250px,1fr);gap:18px}.pillrow{display:flex;justify-content:space-between;align-items:center}.progress-label{font-size:11px;color:var(--muted)}.readiness{font-size:24px;font-weight:650}.modal{position:fixed;inset:0;background:#0a232b80;display:flex;justify-content:center;align-items:center;z-index:40}.modal .card{max-width:680px;max-height:90vh;overflow:auto;width:90%}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:15px;white-space:pre-wrap;font-size:12px}.comparison>div{padding:15px;background:#f3f5f1;border-radius:8px}.count{font-variant-numeric:tabular-nums}.saving-off{color:#9e7d35}@media(min-width:1550px){.two-editor{grid-template-columns:minmax(270px,1fr) minmax(400px,1.25fr)}.a4{width:100%;min-height:800px}}@media(max-width:1150px){.shell{grid-template-columns:175px minmax(0,1fr)}.agent{grid-column:2;position:static;height:480px;border-top:1px solid var(--line)}.workspace{padding:22px}.a4{width:100%;min-height:800px}.sidebar{grid-row:1/3}}@media(max-width:650px){.shell{display:block}.sidebar{padding:15px;display:block}.sidebar .brand{padding-bottom:10px}.sidebar nav{display:flex;overflow:auto}.sidebar nav button{white-space:nowrap}.sidebar .bottom{padding-top:10px}.sidebar .bottom select{max-width:200px}.topbar{padding:14px}.workspace,.stage{padding:16px}.grid{grid-template-columns:1fr}.agent{height:450px}.a4{padding:22px;min-height:600px}.comparison{grid-template-columns:1fr}.card{padding:17px}}
@media print{body{background:white}.shell{display:block}.sidebar,.topbar,.stage,.agent,.workspace>*,#toast,#busybar{display:none!important}.workspace,.workspace .print-target,.workspace .print-target .preview-wrap,.workspace .print-target .a4{display:block!important;padding:0;margin:0;background:white;box-shadow:none;border:0;width:auto;min-height:0}.a4 h2{break-after:avoid}.a4 p{orphans:3;widows:3}@page{size:A4;margin:14mm}}
</style><link rel="stylesheet" href="/application-studio/enhancements.css"></head><body><div id="busybar"></div><div class="shell"><aside class="sidebar"><div class="brand">Career Atelier<small>YOUR EXPERIENCE. CLEARLY.</small></div><nav id="nav"></nav><div class="bottom"><label for="applicationSelect">APPLICATION WORKSPACE</label><select id="applicationSelect"></select><button id="newJob" style="width:100%;margin-top:8px">+ New application</button><button id="settings" style="width:100%;margin-top:15px">Account & privacy</button></div></aside><main class="main"><header class="topbar"><div><strong id="candidateName">Your next chapter</strong><small id="targetRole">Build an honest, focused application</small></div><div><span id="topScore" class="badge">Not analyzed</span><small id="saveStatus" style="display:block;margin-top:5px">Memory only</small></div></header><div class="stage"><div class="steps" id="steps"></div><div class="progress-label" id="stageLabel"></div></div><div class="workspace" id="workspace"></div></main><aside class="agent"><span class="eyebrow">EVIDENCE-FIRST ASSISTANT</span><h2>Career Agent</h2><p class="tiny muted">Works with this application and your verified source profile. Suggestions always need review.</p><div class="messages" id="messages"></div><div class="chips"><button data-prompt="Make the summary more concise.">Shorter summary</button><button data-prompt="Rewrite the work experience without exaggeration.">Honest experience</button><button data-prompt="Explain the most important gaps for this vacancy.">Explain gaps</button></div><textarea id="chatInput" placeholder="Tell the agent what to improve…" aria-label="Career Agent instruction"></textarea><button id="chatSend" class="primary" style="margin-top:10px">Send instruction</button><div class="tiny muted" id="agentMode" style="margin-top:10px">AI connection not checked</div></aside></div><div id="toast" role="status" aria-live="polite"></div><div id="modal" class="modal hidden"></div>
<script>window.CAREER_ATELIER_CONFIG={apiBase:"/api/application-studio",assetBase:"/application-studio"};</script>
<script type="module">import((window.CAREER_ATELIER_CONFIG?.assetBase||'')+'/assets/documents.js').then(()=>render());</script>
<script src="/application-studio/enhancements.js"></script>
<script src="/application-studio/workflow.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2),clone=o=>JSON.parse(JSON.stringify(o));
let KEY='career-atelier-web:guest';const API_BASE=window.CAREER_ATELIER_CONFIG?.apiBase||'/api';let account=null;const navs=['Candidate','Learning & evidence','Vacancy','Match','Review CV changes','CV Design','CV Preview','Cover Letter','Motivation Letter','Final Review','Export PDF'];
const statuses=['Researching','Preparing','Ready to Apply','Applied','Interview','Offer','Rejected','Archived'];
function freshJob(){return{id:uid(),job:{},vacancy:'',url:'',companyResearch:{text:'',url:''},cv:[],analysis:null,changes:[],rejected:[],approved:[],versions:[],cover:null,motivation:null,interview:null,chat:[],status:'Researching',template:'Professional',language:'English',style:'Professional',motivationText:'',notes:'',final:false,undo:[],redo:[]}}
function fresh(){const job=freshJob();return{version:1,workflowVersion:2,learning:[],candidateProfile:{text:'',original:'',linkedinUrl:'',linkedinText:'',sections:[]},applications:[job],active:job.id,stage:0,persist:false,demo:false,consent:false}}
let S=fresh(),conn={token:'',configured:false},busy=false,toastTimer,dirtyTimer;
function isOutdatedPracticeSample(data){return data?.demo===true&&data.applications?.some(j=>String(j.analysis?.scoreNote||'').includes('Not a real NEURA assessment.'))}
function outdatedSampleMessage(){return 'An outdated practice sample that contained personal details was removed. Reload your real CV and vacancy to continue.'}
try{let saved=localStorage.getItem(KEY);if(saved){let data=JSON.parse(saved);if(data.version===1&&Array.isArray(data.applications)&&data.applications.length){if(isOutdatedPracticeSample(data)){localStorage.removeItem(KEY);throw Error(outdatedSampleMessage())}S=migrateWorkflow(data)}}}catch(e){if(e.message?.includes('outdated practice sample'))setTimeout(()=>toast(e.message,true),0)}
const app=()=>S.applications.find(j=>j.id===S.active)||S.applications[0];
function toast(text,error=false){$('toast').textContent=text;$('toast').style.background=error?'#8c3535':'#193c38';$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',6500)}
function save(){try{if(S.persist){localStorage.setItem(KEY,JSON.stringify(S));$('saveStatus').textContent='Saved on this device'}else{$('saveStatus').textContent='Memory only · export a backup'}}catch(e){$('saveStatus').textContent='Storage full — export backup';toast('Device storage is unavailable. Download a backup.',true)}updateTop()}
function updateTop(){const a=app();$('candidateName').textContent=S.candidateProfile.sections[0]?.text?.split('\n')[0]||'Your next chapter';$('targetRole').textContent=[a.job.title,a.job.company].filter(Boolean).join(' · ')||'Build an honest, focused application';$('topScore').textContent=a.analysis?`${a.analysis.score}/100 evidence${assessmentStale()?' · Refresh required':''}${S.demo?' · Sample':''}`:'Not analyzed';$('agentMode').textContent=S.demo?'Sample workspace · AI disabled':conn.configured?'Server AI configured · text sent only on AI actions':'Sign in for AI · open Account & privacy';$('messages').innerHTML=a.chat.length?a.chat.map(m=>`<div class="message ${m.role==='user'?'user':''}">${esc(m.text)}</div>`).join(''):'<div class="message">Start by uploading your CV and adding a vacancy. I can propose changes, explain gaps and help you prepare for the interview.</div>'}
function render(){const a=app();$('nav').innerHTML=navs.map((n,i)=>`<button data-stage="${i}" class="${S.stage===i?'active':''}"><span class="num">${i+1}</span>${n}</button>`).join('');$('steps').innerHTML=navs.map((_,i)=>`<span class="${i<=S.stage?'done':''}"></span>`).join('');$('stageLabel').textContent=`Step ${S.stage+1} of ${navs.length} · ${navs[S.stage]}`;$('applicationSelect').innerHTML=S.applications.map(j=>`<option value="${esc(j.id)}" ${j.id===a.id?'selected':''}>${esc([j.job.company,j.job.title].filter(Boolean).join(' — ')||'Untitled application')}</option>`).join('');$('workspace').innerHTML=[candidateView,learningView,vacancyView,matchView,tailorView,editView,cvPreviewView,()=>letterView('cover'),()=>letterView('motivation'),finalView,exportView][S.stage]()+stepFooter();save();bindView();updateTop();if(busy)document.querySelectorAll('button').forEach(b=>b.disabled=true)}
function title(eyebrow,heading,desc){return`<span class="eyebrow">${eyebrow}</span><h1>${heading}</h1><p class="muted">${desc}</p>`}
function upload(id){return`<div class="upload"><input id="${id}" type="file" accept=".pdf,.docx,.txt,.html,.htm" aria-label="Upload document"><p class="tiny muted">PDF, DOCX, TXT or HTML · up to 10 MB · text extraction happens in your browser</p></div>`}
function candidateView(){let p=S.candidateProfile;return title('01 / MASTER PROFILE','A foundation you can trust.','Upload or paste your CV, review the extracted text, optionally add LinkedIn, then press Next to confirm it for this application.')+`<div class="card"><h3>Original CV</h3>${upload('cvUpload')}<label for="candidateText">Extracted CV / paste your CV</label><textarea id="candidateText" style="min-height:270px" placeholder="Paste your original CV here…">${esc(p.text)}</textarea><div class="note">Read the extracted text before continuing. Scanned PDFs need OCR. Dates, official titles and facts must stay accurate.</div><div class="actions"><button id="confirmProfile">Save reviewed CV</button><button id="demoBtn">Load a fictional sample CV & job</button></div>${p.original?'<details><summary>Preserved original import</summary><pre style="white-space:pre-wrap;font:12px system-ui">'+esc(p.original)+'</pre></details>':''}</div><div class="card"><h3>LinkedIn enrichment</h3><label for="linkedinUrl">LinkedIn Profile URL</label><input id="linkedinUrl" type="url" placeholder="https://www.linkedin.com/in/your-profile" value="${esc(p.linkedinUrl)}"><p class="tiny muted">A URL is a reference only. AI Career has no authenticated LinkedIn connector and does not fetch protected profile pages.</p>${upload('linkedinUpload')}<label for="linkedinText">Paste your own LinkedIn profile text</label><textarea id="linkedinText">${esc(p.linkedinText)}</textarea><button id="saveLinkedin" style="margin-top:10px">Confirm LinkedIn source</button></div>`}
function vacancyView(){const a=app();return title('03 / JOB VACANCY','Choose the opportunity.','Paste the full vacancy, import a document, or retrieve a public page. Structured details found on a public job page are filled in below for you to review.')+`<div class="card"><label for="vacancyUrl">Public vacancy URL</label><div class="row"><input id="vacancyUrl" type="url" placeholder="https://company.example/careers/role" value="${esc(a.url)}"><button id="fetchVacancy">Retrieve page</button></div><p class="tiny muted">Login walls and JavaScript-only pages need pasted text. Structured job data is filled when the page provides it; verify the full advert before analysis.</p>${upload('vacancyUpload')}<label for="vacancyText">Complete vacancy text</label><textarea id="vacancyText" style="min-height:260px">${esc(a.vacancy)}</textarea><div class="grid"><div><label for="jobCompany">Company</label><input id="jobCompany" value="${esc(a.job.company||'')}"></div><div><label for="jobTitle">Position</label><input id="jobTitle" value="${esc(a.job.title||'')}"></div><div><label for="jobLocation">Location</label><input id="jobLocation" value="${esc(a.job.location||'')}"></div><div><label for="employmentType">Employment type</label><input id="employmentType" placeholder="Full-time, contract…" value="${esc(a.job.employmentType||'')}"></div><div><label for="workplaceType">Work arrangement</label><input id="workplaceType" placeholder="On-site, hybrid, remote…" value="${esc(a.job.workplaceType||'')}"></div><div><label for="experienceLevel">Experience level</label><input id="experienceLevel" placeholder="Entry, mid, senior…" value="${esc(a.job.experienceLevel||'')}"></div><div><label for="jobSalary">Salary</label><input id="jobSalary" placeholder="As listed in the vacancy" value="${esc(a.job.salary||'')}"></div><div><label for="datePosted">Date posted</label><input id="datePosted" value="${esc(a.job.datePosted||'')}"></div><div><label for="validThrough">Application deadline</label><input id="validThrough" value="${esc(a.job.validThrough||'')}"></div><div><label for="jobCategory">Job category</label><input id="jobCategory" value="${esc(a.job.category||'')}"></div><div><label for="jobIndustry">Industry</label><input id="jobIndustry" value="${esc(a.job.industry||'')}"></div><div><label for="jobSkills">Listed skills</label><input id="jobSkills" value="${esc(a.job.skills||'')}"></div><div><label for="educationRequirements">Education requirements</label><input id="educationRequirements" value="${esc(a.job.educationRequirements||'')}"></div><div><label for="jobQualifications">Qualifications</label><input id="jobQualifications" value="${esc(a.job.qualifications||'')}"></div><div><label for="jobResponsibilities">Responsibilities</label><input id="jobResponsibilities" value="${esc(a.job.responsibilities||'')}"></div><div><label for="jobWorkHours">Working hours</label><input id="jobWorkHours" value="${esc(a.job.workHours||'')}"></div><div><label for="applicationMethod">Application method</label><input id="applicationMethod" value="${esc(a.job.applicationMethod||'')}"></div><div><label>Document language</label><select id="language">${['English','German','French'].map(v=>`<option ${v===a.language?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="actions"><button id="saveVacancy">Save vacancy</button><button id="analyze" class="primary">Analyze candidate & vacancy</button></div></div><div class="card"><h3>Company context · optional</h3><p class="tiny muted">Retrieve an official company page or paste verified context. No company facts are inferred from the company name alone.</p><div class="row"><input id="companyUrl" type="url" placeholder="Official company information URL" value="${esc(a.companyResearch.url)}"><button id="fetchCompany">Retrieve context</button></div><label for="companyText">Verified company context</label><textarea id="companyText">${esc(a.companyResearch.text)}</textarea><label for="motivationText">Your real motivation, career direction & relocation preferences</label><textarea id="motivationText" placeholder="Why this role and company? Why relocate, if relevant?">${esc(a.motivationText)}</textarea><button id="saveContext" style="margin-top:10px">Save context & motivation</button></div>`}
function matchView(){let a=app(),x=a.analysis;if(!x)return title('04 / AI ANALYSIS','Evidence before editing.','Add a candidate profile and vacancy to create a semantic match analysis.')+`<div class="card empty"><button data-stage="2" class="primary">Go to vacancy</button></div>`;return title('04 / AI ANALYSIS','See the match. Know the gaps.','Structured recruiter screening, with evidence and explicit eligibility checks.')+`${assessmentStale()?'<div class="note warning">CV or vacancy changed since this assessment. Refresh analysis before using this score.</div>':''}${S.demo?'<div class="note warning">Fictional sample assessment. The candidate, employer and vacancy below are invented; this score does not assess a real application.</div>':''}<div class="card"><div class="grid"><div><div class="score">${x.score}<small style="font:14px system-ui"> / 100</small></div><p>Submitted CV evidence score / 100</p><span class="badge">${esc(a.job.title)}</span></div><div>${x.categories.map(c=>`<div class="pillrow tiny"><span>${esc(c.category)} · ${c.weight}% weight</span><strong>${c.score}%</strong></div>`).join('')}</div></div><p class="tiny muted">${esc(x.scoreNote)}</p></div>${scoreExplanation(x)}${recruiterPanel(x)}<div class="card"><h3>Match matrix</h3><div class="table-wrap"><table><thead><tr><th>Vacancy requirement</th><th>Candidate evidence</th><th>Match level</th><th>Action</th></tr></thead><tbody>${x.matrix.map(r=>`<tr><td><strong>${esc(r.requirement)}</strong><br><small>Vacancy: ${esc(r.vacancyQuote||'Not traced — refresh assessment')}</small><br><span class="badge">${esc(r.priority)}</span></td><td class="evidence">${esc((r.evidence||[]).join('\n'))||'No cited evidence in the submitted CV'}<br><small>${esc(r.explanation)}</small></td><td><span class="badge ${['Missing','Unknown'].includes(r.level)?'red':r.level==='Transferable Skill'?'gold':''}">${esc(r.level)}</span></td><td>${esc(r.action)}</td></tr>`).join('')}</tbody></table></div></div><h2>Skills & Experience Gaps</h2>${x.gaps.map(g=>`<div class="card gap"><div class="pillrow"><h3>${esc(g.requirement)}</h3><span class="badge ${g.type==='Critical Gap'?'red':'gold'}">${esc(g.type)}</span></div><p>${esc(g.why)}</p>${g.learn?'<p><strong>What to learn:</strong> '+esc(g.learn)+'</p>':''}${g.depth?'<p class="tiny">Depth: '+esc(g.depth)+' · Priority: '+esc(g.priority)+'</p>':''}${g.questions?.length?'<ul>'+g.questions.map(q=>'<li>'+esc(q)+'</li>').join('')+'</ul>':''}</div>`).join('')}${questions(x)}<div class="actions"><button id="analyze">Refresh analysis</button></div>`}
