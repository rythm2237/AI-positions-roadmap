name: Restore clean Learning sources

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/encoding-normalization-trigger
      - .github/workflows/normalize-restored-source-encoding.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reconstruct affected files from clean Git history
        shell: bash
        run: |
          set -euo pipefail
          stable_commit="e8ac258a0daad59482c34e9c5b21ccfedebb5c00"
          common_ancestor="725bb24d5c95f1e327fd5699595beae41ec82cb6"
          redesign_ref="origin/codex/assessment-redesign"

          path="src/components/career/CareerWorkspace.tsx"
          ours=$(mktemp)
          base=$(mktemp)
          theirs=$(mktemp)
          merged=$(mktemp)
          git show "$stable_commit:$path" > "$ours"
          git show "$common_ancestor:$path" > "$base"
          git show "$redesign_ref:$path" > "$theirs"
          git merge-file --ours -p "$ours" "$base" "$theirs" > "$merged"
          python - "$merged" "$path" <<'PY'
          from pathlib import Path
          import sys
          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          Path(sys.argv[2]).write_text(text, encoding="utf-8", newline="\n")
          PY

          for path in \
            "src/data/careers/ai-automation-specialist.ts" \
            "src/data/careers/ai-engineer.ts"
          do
            git show "$redesign_ref:$path" > "$path"
            python - "$path" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          done

      - name: Restore missing automation interview assessment profile
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/content/assessments/assessmentBank.ts")
          text = path.read_text(encoding="utf-8")
          if '"automation-interview": {' not in text:
              marker = '  "final-assessment": {'
              block = '''  "automation-interview": {
            referenceId: "automation-ms-power-platform-training",
            evidence: "Recorded automation interviews that explain process discovery, architecture, exception handling, governance, testing, monitoring, and measurable business impact",
            firstDecision: "Clarify the process, users, systems, constraints, exception paths, data sensitivity, and success measures before proposing an automation design",
            control: "State assumptions explicitly and include access control, approvals, auditability, monitoring, fallback, and ownership in the solution",
            metric: "The percentage of mock answers that connect technical decisions to process outcomes, risks, controls, and measurable value",
            judgment: "Prefer a bounded maintainable automation with clear ownership over a broad demo that cannot be governed or supported",
          },
'''
              if marker not in text:
                  raise SystemExit("Could not locate final-assessment profile insertion point")
              text = text.replace(marker, block + marker, 1)
              path.write_text(text, encoding="utf-8", newline="\n")
              print("Added automation-interview assessment profile")
          else:
              print("automation-interview assessment profile already present")
          PY

      - name: Verify UTF-8 and conflict-free source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path("src/components/career/CareerWorkspace.tsx"),
              Path("src/data/careers/ai-automation-specialist.ts"),
              Path("src/data/careers/ai-engineer.ts"),
              Path("src/content/assessments/assessmentBank.ts"),
          ]
          for path in paths:
              text = path.read_bytes().decode("utf-8")
              if "<<<<<<<" in text or ">>>>>>>" in text:
                  raise SystemExit(f"Conflict marker remains in {path}")
          PY

      - name: Commit restored files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes required."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/career/CareerWorkspace.tsx src/data/careers/ai-automation-specialist.ts src/data/careers/ai-engineer.ts src/content/assessments/assessmentBank.ts
            git commit -m "fix: restore clean Learning assessment implementation"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Run production build
        run: npm run build
