name: Normalize restored source encoding

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/encoding-normalization-trigger
      - .github/workflows/normalize-restored-source-encoding.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/normalize-restored-source-encoding.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert restored source files to UTF-8
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("src/components/career/CareerWorkspace.tsx"),
              Path("src/data/careers/ai-automation-specialist.ts"),
              Path("src/data/careers/ai-engineer.ts"),
          ]

          for path in paths:
              raw = path.read_bytes()
              try:
                  raw.decode("utf-8")
                  print(f"{path}: already UTF-8")
                  continue
              except UnicodeDecodeError as error:
                  print(f"{path}: invalid UTF-8 at byte {error.start}")

              text = raw.decode("cp1252", errors="replace")
              path.write_text(text, encoding="utf-8", newline="\n")
              print(f"{path}: normalized to UTF-8")
          PY

      - name: Verify UTF-8 source encoding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in [
              Path("src/components/career/CareerWorkspace.tsx"),
              Path("src/data/careers/ai-automation-specialist.ts"),
              Path("src/data/careers/ai-engineer.ts"),
          ]:
              path.read_bytes().decode("utf-8")
              print(f"{path}: valid UTF-8")
          PY

      - name: Commit normalized files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No encoding changes required."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/career/CareerWorkspace.tsx src/data/careers/ai-automation-specialist.ts src/data/careers/ai-engineer.ts
            git commit -m "fix: normalize restored learning sources to UTF-8"
            git push origin HEAD:${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production build
        run: npm run build
