name: Restore clean Learning sources

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/encoding-normalization-trigger
      - .github/workflows/normalize-restored-source-encoding.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore clean Learning and assessment implementation
        shell: bash
        run: |
          set -euo pipefail
          stable_commit="e8ac258a0daad59482c34e9c5b21ccfedebb5c00"
          common_ancestor="725bb24d5c95f1e327fd5699595beae41ec82cb6"
          redesign_ref="origin/codex/assessment-redesign"

          path="src/components/career/CareerWorkspace.tsx"
          ours=$(mktemp)
          base=$(mktemp)
          theirs=$(mktemp)
          merged=$(mktemp)
          git show "$stable_commit:$path" > "$ours"
          git show "$common_ancestor:$path" > "$base"
          git show "$redesign_ref:$path" > "$theirs"
          git merge-file --ours -p "$ours" "$base" "$theirs" > "$merged"
          python - "$merged" "$path" <<'PY'
          from pathlib import Path
          import sys
          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          Path(sys.argv[2]).write_text(text, encoding="utf-8", newline="\n")
          PY

          files=(
            "content/references/reference-catalog.json"
            "scripts/test-career-assessment-gating.mjs"
            "scripts/validate-references.mjs"
            "src/components/career/journey-engine/CareerJourneyEngine.tsx"
            "src/components/career/learning/LearningWorkspace.tsx"
            "src/content/assessments/assessmentBank.ts"
            "src/data/careers/ai-automation-specialist.ts"
            "src/data/careers/ai-engineer-journey.ts"
            "src/data/careers/ai-engineer.ts"
            "src/lib/assessmentPolicy.ts"
            "src/lib/careerWorkspaceProgress.ts"
            "src/types/careerWorkspace.ts"
          )

          for path in "${files[@]}"; do
            git show "$redesign_ref:$path" > "$path"
            python - "$path" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
            echo "$path restored"
          done

          git show "origin/main:scripts/test-public-beta.mjs" > scripts/test-public-beta.mjs

          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/career/CareerWorkspace.tsx")
          text = path.read_text(encoding="utf-8")
          old = '''  return career.journeyStages.flatMap((stage) => [
    {
      assessment: stage.test,
      stage,
      type: "station" as const,
    },
    ...(stage.phaseExam
      ? [
          {
            assessment: stage.phaseExam,
            stage,
            type: "phase" as const,
          },
        ]
      : []),
  ]);
'''
          new = '''  return career.journeyStages.flatMap((stage) => {
    const assessments: Array<{
      assessment: CareerAssessment;
      stage: CareerJourneyStage;
      type: "station" | "phase";
    }> = [];

    if (stage.test) {
      assessments.push({
        assessment: stage.test,
        stage,
        type: "station",
      });
    }

    if (stage.phaseExam) {
      assessments.push({
        assessment: stage.phaseExam,
        stage,
        type: "phase",
      });
    }

    return assessments;
  });
'''
          if old not in text:
              raise SystemExit("Could not locate allAssessments implementation")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          print("Applied type-safe optional assessment narrowing")
          PY

      - name: Verify restored text files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path("content/references/reference-catalog.json"),
              Path("scripts/test-career-assessment-gating.mjs"),
              Path("scripts/test-public-beta.mjs"),
              Path("scripts/validate-references.mjs"),
              Path("src/components/career/CareerWorkspace.tsx"),
              Path("src/components/career/journey-engine/CareerJourneyEngine.tsx"),
              Path("src/components/career/learning/LearningWorkspace.tsx"),
              Path("src/content/assessments/assessmentBank.ts"),
              Path("src/data/careers/ai-automation-specialist.ts"),
              Path("src/data/careers/ai-engineer-journey.ts"),
              Path("src/data/careers/ai-engineer.ts"),
              Path("src/lib/assessmentPolicy.ts"),
              Path("src/lib/careerWorkspaceProgress.ts"),
              Path("src/types/careerWorkspace.ts"),
          ]
          for path in paths:
              text = path.read_bytes().decode("utf-8")
              if "<<<<<<<" in text or ">>>>>>>" in text:
                  raise SystemExit(f"Conflict marker remains in {path}")
          print(f"Verified {len(paths)} restored files")
          PY

      - name: Commit restored files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes required."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/references/reference-catalog.json scripts/test-career-assessment-gating.mjs scripts/test-public-beta.mjs scripts/validate-references.mjs src/components/career/CareerWorkspace.tsx src/components/career/journey-engine/CareerJourneyEngine.tsx src/components/career/learning/LearningWorkspace.tsx src/content/assessments/assessmentBank.ts src/data/careers/ai-automation-specialist.ts src/data/careers/ai-engineer-journey.ts src/data/careers/ai-engineer.ts src/lib/assessmentPolicy.ts src/lib/careerWorkspaceProgress.ts src/types/careerWorkspace.ts
            git commit -m "fix: restore complete clean Learning implementation"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Run production build
        run: npm run build
