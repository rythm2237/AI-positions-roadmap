name: Restore clean Learning sources

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/encoding-normalization-trigger
      - .github/workflows/normalize-restored-source-encoding.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reconstruct affected files from clean Git history
        shell: bash
        run: |
          set -euo pipefail
          stable_commit="e8ac258a0daad59482c34e9c5b21ccfedebb5c00"
          common_ancestor="725bb24d5c95f1e327fd5699595beae41ec82cb6"
          redesign_ref="origin/codex/assessment-redesign"

          path="src/components/career/CareerWorkspace.tsx"
          ours=$(mktemp)
          base=$(mktemp)
          theirs=$(mktemp)
          merged=$(mktemp)
          git show "$stable_commit:$path" > "$ours"
          git show "$common_ancestor:$path" > "$base"
          git show "$redesign_ref:$path" > "$theirs"
          git merge-file --ours -p "$ours" "$base" "$theirs" > "$merged"
          python - "$merged" "$path" <<'PY'
          from pathlib import Path
          import sys
          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          Path(sys.argv[2]).write_text(text, encoding="utf-8", newline="\n")
          PY
          echo "$path reconstructed with stable Production conflict resolution"

          for path in \
            "src/data/careers/ai-automation-specialist.ts" \
            "src/data/careers/ai-engineer.ts"
          do
            git show "$redesign_ref:$path" > "$path"
            python - "$path" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
            echo "$path restored from clean assessment redesign"
          done

      - name: Verify UTF-8 and conflict-free source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path("src/components/career/CareerWorkspace.tsx"),
              Path("src/data/careers/ai-automation-specialist.ts"),
              Path("src/data/careers/ai-engineer.ts"),
          ]
          for path in paths:
              text = path.read_bytes().decode("utf-8")
              if "<<<<<<<" in text or ">>>>>>>" in text:
                  raise SystemExit(f"Conflict marker remains in {path}")
              print(f"{path}: valid UTF-8 and conflict-free")
          PY

      - name: Commit reconstructed files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes required."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/career/CareerWorkspace.tsx src/data/careers/ai-automation-specialist.ts src/data/careers/ai-engineer.ts
            git commit -m "fix: restore clean Learning and assessment sources"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Run production build
        run: npm run build
