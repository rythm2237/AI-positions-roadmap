name: Normalize restored source encoding

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/normalize-restored-source-encoding.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert restored source files to UTF-8
        shell: python
        run: |
          from pathlib import Path

          paths = [
              Path("src/components/career/CareerWorkspace.tsx"),
              Path("src/data/careers/ai-automation-specialist.ts"),
              Path("src/data/careers/ai-engineer.ts"),
          ]

          for path in paths:
              raw = path.read_bytes()
              try:
                  raw.decode("utf-8")
                  print(f"{path}: already UTF-8")
                  continue
              except UnicodeDecodeError:
                  pass

              text = raw.decode("cp1252")
              path.write_text(text, encoding="utf-8", newline="\n")
              print(f"{path}: converted from Windows-1252 to UTF-8")

      - name: Commit normalized files
        run: |
          if git diff --quiet; then
            echo "No encoding changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/career/CareerWorkspace.tsx src/data/careers/ai-automation-specialist.ts src/data/careers/ai-engineer.ts
          git commit -m "fix: normalize restored learning sources to UTF-8"
          git push
