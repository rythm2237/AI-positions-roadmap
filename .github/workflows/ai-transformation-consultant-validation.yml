name: AI Transformation Consultant Validation

on:
  pull_request:
    paths:
      - "src/data/careers/ai-transformation-consultant.ts"
      - "src/data/milestones/ai-transformation-consultant.ts"
      - "src/data/resource-requirements/ai-transformation-consultant.ts"
      - "src/data/milestones/index.ts"
      - "src/data/careerCatalog.ts"
      - "src/app/careers/**"
      - "src/components/career/learning/**"
      - "scripts/test-ai-transformation-consultant-career.mjs"
      - ".github/workflows/ai-transformation-consultant-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/test-ai-transformation-consultant-career.mjs
      - run: npm run typecheck
      - run: npm run build
