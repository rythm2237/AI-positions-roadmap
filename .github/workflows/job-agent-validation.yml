name: Job Agent validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/lib/job-agent/**"
      - "src/lib/cvAnalyzer/masterCvEvidence.ts"
      - "src/lib/publishedCareerRepository.ts"
      - "src/lib/publishedCareerFetch.ts"
      - "src/app/(account)/job-agent/**"
      - "src/app/careers/**"
      - "src/components/job-agent/**"
      - "scripts/test-job-acquisition-system.mjs"
      - "scripts/test-multisource-job-discovery.mjs"
      - "scripts/test-apify-job-provider.mjs"
      - "scripts/test-workday-job-provider.mjs"
      - "scripts/test-scheduled-job-discovery.mjs"
      - "scripts/test-published-career-repository.mjs"
      - "scripts/test-live-direct-provider.mjs"
      - "scripts/test-job-agent-evidence-provenance.mjs"
      - "scripts/test-job-agent-search-ux.mjs"
      - "scripts/test-job-agent-trusted-source-recovery.mjs"
      - "scripts/test-job-agent-rate-limit-continuity.mjs"
      - "scripts/test-job-agent-recovery-priority.mjs"
      - "scripts/test-job-agent-recovery-relevance-ranking.mjs"
      - "supabase/migrations/**job**"
      - "vercel.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/job-agent-validation.yml"
  push:
    branches:
      - main
      - feat/multisource-job-discovery-v2
    paths:
      - "src/lib/job-agent/**"
      - "src/lib/cvAnalyzer/masterCvEvidence.ts"
      - "src/lib/publishedCareerRepository.ts"
      - "src/lib/publishedCareerFetch.ts"
      - "src/app/(account)/job-agent/**"
      - "src/app/careers/**"
      - "src/components/job-agent/**"
      - "scripts/test-job-acquisition-system.mjs"
      - "scripts/test-multisource-job-discovery.mjs"
      - "scripts/test-apify-job-provider.mjs"
      - "scripts/test-workday-job-provider.mjs"
      - "scripts/test-scheduled-job-discovery.mjs"
      - "scripts/test-published-career-repository.mjs"
      - "scripts/test-live-direct-provider.mjs"
      - "scripts/test-job-agent-evidence-provenance.mjs"
      - "scripts/test-job-agent-search-ux.mjs"
      - "scripts/test-job-agent-trusted-source-recovery.mjs"
      - "scripts/test-job-agent-rate-limit-continuity.mjs"
      - "scripts/test-job-agent-recovery-priority.mjs"
      - "scripts/test-job-agent-recovery-relevance-ranking.mjs"
      - "supabase/migrations/**job**"
      - "vercel.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/job-agent-validation.yml"

permissions:
  contents: read

jobs:
  validate-job-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Managed-content outage regressions
        run: node --conditions=react-server --experimental-strip-types --test --test-concurrency=1 scripts/test-published-career-repository.mjs

      - name: Evidence provenance regressions
        run: node --experimental-strip-types --test --test-concurrency=1 scripts/test-job-agent-evidence-provenance.mjs

      - name: Search UX regressions
        run: node --test --test-concurrency=1 scripts/test-job-agent-search-ux.mjs

      - name: Trusted-source recovery regressions
        run: node --experimental-strip-types --test --test-concurrency=1 scripts/test-job-agent-trusted-source-recovery.mjs

      - name: Rate-limit continuity regressions
        run: node --experimental-strip-types --test --test-concurrency=1 scripts/test-job-agent-rate-limit-continuity.mjs

      - name: Recovery priority regressions
        run: node --experimental-strip-types --test --test-concurrency=1 scripts/test-job-agent-recovery-priority.mjs

      - name: Recovery relevance ranking regressions
        run: node --experimental-strip-types --test --test-concurrency=1 scripts/test-job-agent-recovery-relevance-ranking.mjs

      - name: Job Acquisition System suite
        run: npm run test:job-acquisition

      - name: Multi-source discovery suite
        run: npm run test:multisource-discovery

      - name: Apify provider suite
        run: npm run test:apify-provider

      - name: Workday provider suite
        run: npm run test:workday-provider

      - name: Scheduled discovery suite
        run: npm run test:scheduled-discovery

      - name: Production build with unavailable managed-content database
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://managed-content-unavailable.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-anon-key
        run: npm run build

      - name: Live no-cost Direct provider smoke test
        run: node --conditions=react-server --experimental-strip-types scripts/test-live-direct-provider.mjs
