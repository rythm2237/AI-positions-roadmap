name: Job Agent validation

on:
  pull_request:
    paths:
      - "src/lib/job-agent/**"
      - "src/lib/cvAnalyzer/masterCvEvidence.ts"
      - "src/app/(account)/job-agent/**"
      - "scripts/test-job-acquisition-system.mjs"
      - "scripts/test-job-agent-evidence-provenance.mjs"
      - "supabase/migrations/**job**"
      - "vercel.json"
      - "package.json"
      - ".github/workflows/job-agent-validation.yml"
  push:
    branches:
      - main
    paths:
      - "src/lib/job-agent/**"
      - "src/lib/cvAnalyzer/masterCvEvidence.ts"
      - "src/app/(account)/job-agent/**"
      - "scripts/test-job-acquisition-system.mjs"
      - "scripts/test-job-agent-evidence-provenance.mjs"
      - "supabase/migrations/**job**"
      - "vercel.json"
      - "package.json"
      - ".github/workflows/job-agent-validation.yml"

permissions:
  contents: read

jobs:
  validate-job-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Evidence provenance regressions
        run: node --experimental-strip-types --test scripts/test-job-agent-evidence-provenance.mjs

      - name: Diagnose layers 1-5
        continue-on-error: true
        run: node --experimental-strip-types --test --test-name-pattern="Layer ([1-5]) —" scripts/test-job-acquisition-system.mjs

      - name: Diagnose layers 6-10
        continue-on-error: true
        run: node --experimental-strip-types --test --test-name-pattern="Layer (6|7|8|9|10) —" scripts/test-job-acquisition-system.mjs

      - name: Diagnose layers 11-15
        continue-on-error: true
        run: node --experimental-strip-types --test --test-name-pattern="Layer (11|12|13|14|15) —" scripts/test-job-acquisition-system.mjs

      - name: Diagnose layers 16-20
        continue-on-error: true
        run: node --experimental-strip-types --test --test-name-pattern="Layer (16|17|18|19|20) —" scripts/test-job-acquisition-system.mjs

      - name: Run complete 20-layer Job Acquisition System suite
        run: npm run test:job-acquisition

      - name: Typecheck
        if: always()
        run: npm run typecheck
